[build]
  publish = "."
  # Plain static files: there is nothing to build. Without this, Netlify's
  # framework detection guesses a build command and the deploy fails.
  command = ""

# The service worker must never be served stale, otherwise installed copies
# never learn about a new version of the guide.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # Netlify serves an unknown extension as octet-stream, which some
    # browsers refuse to treat as an installable web app manifest.
    Content-Type = "application/manifest+json; charset=utf-8"

# Fonts and icons are content-stable; cache them hard.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
