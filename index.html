<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="دليل العمرة خطوة بخطوة مع الأدعية المأثورة في كل موضع — Umrah step-by-step guide with the du'as for each place.">
  <meta name="theme-color" content="#0f5c4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="دليل العمرة">
  <title>دليل العمرة — Umrah Guide</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/Amiri-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">تخطَّ إلى المحتوى</a>

  <header class="topbar" role="banner">
    <button class="topbar__btn topbar__home" id="btn-home" type="button" data-i18n-label="home">
      <span class="topbar__icon" aria-hidden="true">🕋</span>
      <span class="topbar__text" data-i18n="appName">دليل العمرة</span>
    </button>
    <div class="topbar__controls">
      <button class="topbar__btn" id="btn-font-dec" type="button" dir="ltr" data-i18n-label="fontDec">A−</button>
      <button class="topbar__btn" id="btn-font-inc" type="button" dir="ltr" data-i18n-label="fontInc">A+</button>
      <button class="topbar__btn topbar__lang" id="btn-lang" type="button" data-i18n-label="switchLang">English</button>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <nav class="stepnav" id="stepnav" aria-label="التنقل بين الخطوات" hidden>
    <button class="stepnav__btn stepnav__prev" id="btn-prev" type="button">
      <span class="stepnav__arrow" id="arrow-prev" aria-hidden="true"></span>
      <span data-i18n="prev">السابق</span>
    </button>
    <div class="stepnav__progress" id="progress" aria-live="polite"></div>
    <button class="stepnav__btn stepnav__next" id="btn-next" type="button">
      <span data-i18n="next">التالي</span>
      <span class="stepnav__arrow" id="arrow-next" aria-hidden="true"></span>
    </button>
  </nav>

  <div class="install-banner" id="install-banner" hidden>
    <p class="install-banner__text" id="install-text"></p>
    <div class="install-banner__actions">
      <button class="btn btn--primary" id="btn-install" type="button" data-i18n="install">تثبيت التطبيق</button>
      <button class="btn btn--ghost" id="btn-install-dismiss" type="button" data-i18n="later">لاحقاً</button>
    </div>
  </div>

  <script src="js/data/steps.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/illustrations.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
